name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # GOTOOLCHAIN=local stops the go command from auto-downloading the version
    # named by the `toolchain` line in go.mod. Without it every matrix entry
    # silently switches to that toolchain and the matrix tests one version.
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (must match the `go` directive in go.mod), previous
        # stable, current stable.
        go: ['1.21', '1.26', '1.27']
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify generated constants are up to date
        run: |
          make generate
          git diff --exit-code -- cryptoki/zconst.go \
            || { echo "::error::cryptoki/zconst.go is stale; run 'make generate' and commit."; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

  windows-build:
    name: Build (windows/amd64, cgo)
    runs-on: windows-latest
    # Temporarily disabled: Windows cgo build needs patching. Re-enable by
    # removing this `if: false` once the Windows loader path is fixed.
    if: false
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # windows-latest ships a MinGW gcc on PATH, which cgo uses to compile the
      # Windows loader path (LoadLibrary/GetProcAddress) in cryptoki/shim.c.
      - name: Build (cgo)
        env:
          CGO_ENABLED: '1'
        run: go build ./...

      - name: go vet
        run: go vet ./...

  integration:
    name: Integration (SoftHSMv2 PQC)
    # ubuntu-26.04 ships OpenSSL 3.5, which SoftHSMv2 needs for ML-KEM/ML-DSA.
    # ubuntu-24.04 ships OpenSSL 3.0.13 and cannot build the PQC module.
    runs-on: ubuntu-26.04
    needs: build-test
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # Builds SoftHSMv2 main with ML-KEM/ML-DSA against the runner's OpenSSL
      # 3.5 and exports PKCS11_MODULE. The apt libsofthsm2 on ubuntu-24.04 is
      # 2.6.1: it advertises wrong HMAC key sizes and has no ML-KEM/ML-DSA, so
      # the v3.2 tests self-skipped instead of running.
      - name: Set up SoftHSMv2 (PQC)
        uses: ./.github/actions/setup-softhsmv2-pqc

      - name: Run integration tests
        env:
          PKCS11_PIN: '1234'
        run: make integration PKCS11_MODULE="$PKCS11_MODULE"
