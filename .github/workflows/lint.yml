name: Lint

# golangci-lint (configured via .golangci.yml) bundles staticcheck, gosec,
# formatters and more — the modern replacement for the deprecated golint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # cgo (cryptoki/shim.c) needs a C toolchain; ubuntu-latest ships gcc.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
