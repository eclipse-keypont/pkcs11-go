name: Secret Scan

# Scans the repository (full history on push, the diff on PRs) for committed
# secrets — API keys, tokens, private keys, HSM PINs — using Gitleaks.
#
# Note: GitHub also offers native secret scanning (Settings > Code security),
# free for public repos. This workflow adds in-CI / PR-gating coverage on top.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history so push scans cover the new commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub organization accounts.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
